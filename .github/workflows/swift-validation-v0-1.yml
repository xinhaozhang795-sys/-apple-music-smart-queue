name: Swift Package Validation v0.1

on:
  push:
    branches:
      - agent/repository-skeleton-v0-1
  pull_request:
    branches: [main]

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and package information
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -scheme AppleMusicSmartQueue-Package

      - name: Build iOS package
        run: |
          xcodebuild \
            -scheme AppleMusicSmartQueue-Package \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            build

      - name: Run Swift package tests on iOS Simulator
        run: |
          xcodebuild \
            -scheme AppleMusicSmartQueue-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            test
