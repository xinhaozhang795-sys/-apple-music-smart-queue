name: Swift Package Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve package
        run: xcodebuild -resolvePackageDependencies -scheme AppleMusicSmartQueue-Package

      - name: Build iOS package
        run: xcodebuild -scheme AppleMusicSmartQueue-Package -destination 'generic/platform=iOS' build
