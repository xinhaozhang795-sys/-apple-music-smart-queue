name: Swift Package Validation

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - refactor/smart-queue-2-intelligence

permissions:
  contents: read

concurrency:
  group: swift-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and package information
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -list -json -workspace .

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -workspace . \
            -scheme AppleMusicSmartQueue-Package

      - name: Build iOS package
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace . \
            -scheme AppleMusicSmartQueue-Package \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            build

      - name: Run Swift package tests on iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace . \
            -scheme AppleMusicSmartQueue-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            test
