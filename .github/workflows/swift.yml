name: Swift Package Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: List Xcode project schemes
        run: xcodebuild -project AppleMusicSmartQueue.xcodeproj -list

      - name: Build iOS application and package integration
        run: |
          xcodebuild \
            -project AppleMusicSmartQueue.xcodeproj \
            -scheme AppleMusicSmartQueue \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Test SmartQueueDomain on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-package
          mkdir .ci-package
          rsync -a \
            --exclude 'AppleMusicSmartQueue.xcodeproj' \
            --exclude 'AppleMusicSmartQueue/' \
            --exclude '.git/' \
            ./ .ci-package/
          cd .ci-package
          PACKAGE_SCHEME="SmartQueueDomain"
          xcodebuild -list
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$DEVICE_ID"
          xcodebuild \
            -scheme "$PACKAGE_SCHEME" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -only-testing SmartQueueDomainTests/SessionContextTests \
            test
