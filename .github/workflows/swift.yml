name: Swift Package Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: List Xcode project schemes
        run: xcodebuild -project AppleMusicSmartQueue.xcodeproj -list

      - name: Build iOS application and package integration
        run: |
          xcodebuild \
            -project AppleMusicSmartQueue.xcodeproj \
            -scheme AppleMusicSmartQueue \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Test SmartQueueDomain logic in isolation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-domain-package
          mkdir -p .ci-domain-package/Sources/SmartQueueCore
          mkdir -p .ci-domain-package/Sources/SmartQueueDomain
          mkdir -p .ci-domain-package/Tests/SmartQueueDomainTests

          rsync -a Sources/SmartQueueCore/ .ci-domain-package/Sources/SmartQueueCore/
          rsync -a Sources/SmartQueueDomain/ .ci-domain-package/Sources/SmartQueueDomain/
          rsync -a Tests/SmartQueueDomainTests/ .ci-domain-package/Tests/SmartQueueDomainTests/

          cat > .ci-domain-package/Package.swift <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "SmartQueueDomainCI",
              platforms: [
                  .macOS(.v15),
                  .iOS(.v18)
              ],
              products: [
                  .library(name: "SmartQueueCore", targets: ["SmartQueueCore"]),
                  .library(name: "SmartQueueDomain", targets: ["SmartQueueDomain"])
              ],
              targets: [
                  .target(name: "SmartQueueCore"),
                  .target(name: "SmartQueueDomain", dependencies: ["SmartQueueCore"]),
                  .testTarget(name: "SmartQueueDomainTests", dependencies: ["SmartQueueDomain"])
              ]
          )
          EOF

          swift test --package-path .ci-domain-package --filter SessionContextTests
